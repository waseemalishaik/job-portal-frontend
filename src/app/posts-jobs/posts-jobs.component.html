<section class="vh-100" style="background-color: #eee;">
  <div class="container h-100">
    <div class="row d-flex justify-content-center align-items-center h-100">
      <div class="col-lg-12 col-xl-10">
        <div class="card text-black" style="border-radius: 25px;">
          <div class="card-body p-md-5">
            <div class="row justify-content-center">
              <div class="col-md-10 col-lg-6 col-xl-6">
                <p class="text-center h1 fw-bold mb-4">Post a Job</p>

                <form (ngSubmit)="postJob()" #jobForm="ngForm">

                  <div class="mb-3">
                    <label class="form-label">Job Title</label>
                    <input type="text" class="form-control" [(ngModel)]="job.JobTitle" name="JobTitle" required />
                  </div>

                  <div class="mb-3">
                    <label class="form-label">Company Name</label>
                    <input type="text" class="form-control" [(ngModel)]="job.CompanyName" name="CompanyName" required />
                  </div>

                  <div class="mb-3">
                    <label class="form-label">Location</label>
                    <input type="text" class="form-control" [(ngModel)]="job.Location" name="Location" required />
                  </div>

                  <div class="mb-3">
                    <label class="form-label">Job Type</label>
                    <select class="form-control" [(ngModel)]="job.JobType" name="JobType" required>
                      <option value="Full-Time">Full-Time</option>
                      <option value="Part-Time">Part-Time</option>
                      <option value="Remote">Remote</option>
                    </select>
                  </div>

                  <div class="mb-3">
                    <label class="form-label">Salary Range</label>
                    <input type="text" class="form-control" [(ngModel)]="job.SalaryRange" name="SalaryRange" required />
                  </div>

                  <div class="mb-3">
                    <label class="form-label">Job Description</label>
                    <textarea class="form-control" rows="4" [(ngModel)]="job.JobDescription" name="JobDescription" required></textarea>
                  </div>

                  <div class="mb-3">
                    <label class="form-label">Required Skills</label>
                    <input type="text" class="form-control" [(ngModel)]="job.RequiredSkills" name="RequiredSkills" required />
                  </div>

                  <div class="mb-3">
                    <label class="form-label">Contact Email</label>
                    <input type="email" class="form-control" [(ngModel)]="job.ContactEmail" name="ContactEmail" required />
                  </div>

                  <div class="text-center">
                    <button type="submit" class="btn btn-primary btn-lg">Post Job</button>
                  </div>

                </form>
              </div>

              <div class="col-md-10 col-lg-6 col-xl-6 d-flex align-items-center">
                <img src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-registration/draw1.webp"
                  class="img-fluid" alt="Job Posting Image">
              </div>

            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
