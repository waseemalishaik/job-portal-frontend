<section class="vh-100" style="background-color: #eee;">
    <div class="container h-100">
      <div class="row d-flex justify-content-center align-items-center h-100">
        <div class="col-lg-12 col-xl-11">
          <div class="card text-black" style="border-radius: 25px;">
            <div class="card-body p-md-5">
              <div class="row justify-content-center">
                <div class="col-md-10 col-lg-6 col-xl-5 order-2 order-lg-1">
  
                  <p class="text-center h1 fw-bold mb-5 mx-1 mx-md-4 mt-4">Job Seeker Registration</p>
  
                  <form (ngSubmit)="register()">
  
                    <div class="mb-3">
                      <label for="name" class="form-label">Full Name</label>
                      <input type="text" id="name" class="form-control" [(ngModel)]="User.name" name="name" required>
                    </div>
  
                    <div class="mb-3">
                      <label for="phone" class="form-label">Phone Number</label>
                      <input type="text" id="phone" class="form-control" [(ngModel)]="User.phone" name="phone" required>
                    </div>
  
                    <div class="mb-3">
                      <label for="email" class="form-label">Email</label>
                      <input type="email" id="email" class="form-control" [(ngModel)]="User.email" name="email" required>
                    </div>
  
                    <div class="mb-3">
                      <label for="password" class="form-label">Password</label>
                      <input type="password" id="password" class="form-control" [(ngModel)]="User.password" name="password" required>
                    </div>
  
                    <div class="mb-3">
                      <label for="education" class="form-label">Education</label>
                      <input type="text" id="education" class="form-control" [(ngModel)]="User.education" name="education" required>
                    </div>
  
                    <div class="d-flex justify-content-center">
                      <button type="submit" class="btn btn-primary btn-lg" (click)="register()" >Register</button>
                    </div>
  
                  </form>
  
                </div>
                <div class="col-md-10 col-lg-6 col-xl-7 d-flex align-items-center order-1 order-lg-2">
                  <img src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-registration/draw1.webp"
                       class="img-fluid" alt="Sample image">
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
